name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # tests/test_operator_panel_core.py and tests/test_operator_panel_preview.py
      # run app/ui/app.js under node to prove the browser code cannot decide
      # allow/deny. Pin the runtime instead of relying on the runner image.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Show the resolved dependency set
        run: python -m pip list

      - name: Run test suite
        run: python -m pytest -q

  package:
    name: build and inspect wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Assert the wheel ships every runtime data file
        run: |
          python - <<'PY'
          import glob
          import zipfile

          wheel = glob.glob("dist/*.whl")[0]
          names = set(zipfile.ZipFile(wheel).namelist())

          required = {
              "app/ui/index.html",
              "app/ui/app.js",
              "app/ui/style.css",
              "app/evolution/templates/diagnose_port_owner.json",
              "app/evolution/templates/safe_disk_triage.json",
              "app/evolution/templates/safe_file_search.json",
              "app/evolution/templates/safe_user_lifecycle.json",
          }
          missing = sorted(required - names)
          if missing:
              raise SystemExit(f"{wheel} is missing runtime data files: {missing}")

          top_level = {name.split("/", 1)[0] for name in names if name}
          unexpected = sorted(
              name
              for name in top_level
              if name != "app" and not name.endswith(".dist-info")
          )
          if unexpected:
              raise SystemExit(f"{wheel} leaks top-level members: {unexpected}")

          print(f"{wheel} ships {sorted(required)}")
          PY

      - name: Install the built wheel into a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/verify"
          "$RUNNER_TEMP/verify/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/verify/bin/python" -m pip install dist/*.whl

      # Run from outside the checkout, otherwise `import app` would resolve to
      # the source tree and the check would pass even for an empty wheel.
      - name: Import the installed package from outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/verify/bin/python" - <<'PY'
          import app

          if "site-packages" not in app.__file__:
              raise SystemExit(f"imported the source tree, not the wheel: {app.__file__}")

          from app.main import create_app
          from app.evolution.workflows import DEFAULT_TEMPLATE_DIR, load_workflow_templates

          create_app()

          expected = {
              "diagnose_port_owner",
              "safe_disk_triage",
              "safe_file_search",
              "safe_user_lifecycle",
          }
          templates = load_workflow_templates()
          missing = sorted(expected - set(templates))
          if missing:
              raise SystemExit(f"installed wheel cannot load workflow templates: {missing}")

          print(f"app imports from {app.__file__}, mounts the UI")
          print(f"workflow templates load from {DEFAULT_TEMPLATE_DIR}")
          PY
