[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "guardedops"
version = "0.1.0"
description = "A safety-first conversational Linux/SSH operations agent."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "VictorMaxWang" }]
keywords = ["linux", "ssh", "operations", "agent", "policy", "safety"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.6",
    "paramiko>=3.4",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "httpx>=0.23",
]
llm = [
    "openai>=1.40",
]

[project.scripts]
guardedops = "app.cli:main"

[project.urls]
Homepage = "https://github.com/VictorMaxWang/AI_Hackathon_20260422"
Repository = "https://github.com/VictorMaxWang/AI_Hackathon_20260422"
Issues = "https://github.com/VictorMaxWang/AI_Hackathon_20260422/issues"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.ui" = ["*.html", "*.js", "*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
